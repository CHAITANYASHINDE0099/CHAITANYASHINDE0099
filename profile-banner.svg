<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Chaitanya Shinde</title>
  <desc id="description">AI and Data Science Engineering. A cyan and lavender CS monogram surrounded by orbits on a navy grid.</desc>
  <defs>
